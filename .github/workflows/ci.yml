name: ci
on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      # The Go SDK (github.com/trulayer/client-go) is a private repo
      # during the pre-publish window, so we vendor it into demo-go
      # so CI can build without a cross-repo checkout token.
      - name: go build
        run: go build -mod=vendor ./...
      - name: go test
        run: go test -mod=vendor ./...
        env:
          TRULAYER_DRY_RUN: "true"
