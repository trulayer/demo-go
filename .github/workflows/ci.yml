name: ci
on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...
        env:
          TRULAYER_DRY_RUN: "true"
